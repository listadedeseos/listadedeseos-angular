<svg width="1600" height="440" viewBox="0 0 1600 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="grBg" cx="50%" cy="-15%" r="95%">
      <stop offset="0%" stop-color="#22335A"/>
      <stop offset="55%" stop-color="#182747"/>
      <stop offset="100%" stop-color="#111E38"/>
    </radialGradient>
    <style>
      @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
      @keyframes twinkle { 0%,100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.1); } }
    </style>
  </defs>

  <rect width="1600" height="440" fill="url(#grBg)"/>

  <!-- sparkles -->
  <g fill="#D9B978">
    <path style="animation:twinkle 3.6s ease-in-out infinite" d="M300 110c2 12 6 16 18 18-12 2-16 6-18 18-2-12-6-16-18-18 12-2 16-6 18-18z"/>
    <path style="animation:twinkle 4.2s ease-in-out .5s infinite" d="M1300 300c2 12 6 16 18 18-12 2-16 6-18 18-2-12-6-16-18-18 12-2 16-6 18-18z"/>
    <path style="animation:twinkle 3.2s ease-in-out .8s infinite" d="M1240 90c1.6 9 4.5 12 13.5 13.5-9 1.6-12 4.5-13.5 13.5-1.6-9-4.5-12-13.5-13.5 9-1.6 12-4.5 13.5-13.5z"/>
    <path style="animation:twinkle 4.6s ease-in-out .3s infinite" d="M360 330c1.6 9 4.5 12 13.5 13.5-9 1.6-12 4.5-13.5 13.5-1.6-9-4.5-12-13.5-13.5 9-1.6 12-4.5 13.5-13.5z"/>
    <circle cx="1120" cy="360" r="4"/><circle cx="480" cy="90" r="4"/><circle cx="900" cy="70" r="3"/>
  </g>

  <!-- laurel left -->
  <g transform="translate(150,220)" stroke="#D9B978" stroke-width="3" fill="none">
    <path d="M0 130 C -50 60 -50 -20 -10 -90"/>
    <g fill="#D9B978" stroke="none">
      <ellipse cx="-38" cy="80" rx="16" ry="8" transform="rotate(30 -38 80)"/>
      <ellipse cx="-46" cy="40" rx="16" ry="8" transform="rotate(20 -46 40)"/>
      <ellipse cx="-46" cy="0" rx="16" ry="8" transform="rotate(5 -46 0)"/>
      <ellipse cx="-40" cy="-40" rx="15" ry="7" transform="rotate(-10 -40 -40)"/>
      <ellipse cx="-28" cy="-74" rx="14" ry="7" transform="rotate(-25 -28 -74)"/>
    </g>
  </g>

  <!-- laurel right (mirror) -->
  <g transform="translate(1450,220) scale(-1,1)" stroke="#D9B978" stroke-width="3" fill="none">
    <path d="M0 130 C -50 60 -50 -20 -10 -90"/>
    <g fill="#D9B978" stroke="none">
      <ellipse cx="-38" cy="80" rx="16" ry="8" transform="rotate(30 -38 80)"/>
      <ellipse cx="-46" cy="40" rx="16" ry="8" transform="rotate(20 -46 40)"/>
      <ellipse cx="-46" cy="0" rx="16" ry="8" transform="rotate(5 -46 0)"/>
      <ellipse cx="-40" cy="-40" rx="15" ry="7" transform="rotate(-10 -40 -40)"/>
      <ellipse cx="-28" cy="-74" rx="14" ry="7" transform="rotate(-25 -28 -74)"/>
    </g>
  </g>

  <!-- grad cap -->
  <g style="animation:floaty 6s ease-in-out infinite; transform-origin:800px 118px;">
    <polygon points="800,78 872,110 800,142 728,110" fill="#D9B978"/>
    <path d="M760 124 v26 q40 24 80 0 v-26" fill="#C79E5C"/>
    <line x1="872" y1="110" x2="872" y2="150" stroke="#B98E4C" stroke-width="3"/>
    <circle cx="872" cy="156" r="7" fill="#B98E4C"/>
  </g>
</svg>
