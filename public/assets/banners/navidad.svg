    <path style="animation:twinkle 3.4s ease-in-out .5s infinite" d="M900 360c1.6 9 4.5 12 13.5 13.5-9 1.6-12 4.5-13.5 13.5-1.6-9-4.5-12-13.5-13.5 9-1.6 12-4.5 13.5-13.5z"/>
    <circle cx="600" cy="380" r="3"/><circle cx="1000" cy="380" r="3"/><circle cx="800" cy="400" r="3"/>
  </g>
