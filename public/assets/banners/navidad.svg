<svg width="1600" height="440" viewBox="0 0 1600 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="xmBg" cx="50%" cy="-20%" r="100%">
      <stop offset="0%" stop-color="#134838"/>
      <stop offset="55%" stop-color="#0E3B2E"/>
      <stop offset="100%" stop-color="#0A2C22"/>
    </radialGradient>
    <style>
      @keyframes sway { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
      @keyframes twinkle { 0%,100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.1); } }
    </style>
  </defs>

  <rect width="1600" height="440" fill="url(#xmBg)"/>

  <!-- string lights -->
  <path d="M0 40 Q 400 130 800 60 T 1600 40" stroke="#1C5A46" stroke-width="2.5" fill="none"/>
  <g>
    <circle cx="180" cy="86" r="7" fill="#E3B85A"/><circle cx="360" cy="104" r="7" fill="#C1443B"/>
    <circle cx="540" cy="96" r="7" fill="#E3B85A"/><circle cx="1060" cy="96" r="7" fill="#C1443B"/>
    <circle cx="1240" cy="104" r="7" fill="#E3B85A"/><circle cx="1420" cy="86" r="7" fill="#C1443B"/>
  </g>

  <!-- pine branch top-left -->
  <g stroke="#2E7A5C" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M-10 40 L 260 150"/>
    <path d="M40 60 l -20 -30 M40 60 l 10 -34"/>
    <path d="M100 84 l -22 -28 M100 84 l 8 -34"/>
    <path d="M160 108 l -22 -28 M160 108 l 8 -34"/>
    <path d="M220 132 l -22 -28 M220 132 l 8 -34"/>
  </g>
  <circle cx="70" cy="70" r="8" fill="#C1443B"/><circle cx="150" cy="100" r="8" fill="#C1443B"/><circle cx="230" cy="128" r="8" fill="#C1443B"/>

  <!-- pine branch top-right -->
  <g stroke="#2E7A5C" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M1610 40 L 1340 150"/>
    <path d="M1560 60 l 20 -30 M1560 60 l -10 -34"/>
    <path d="M1500 84 l 22 -28 M1500 84 l -8 -34"/>
    <path d="M1440 108 l 22 -28 M1440 108 l -8 -34"/>
    <path d="M1380 132 l 22 -28 M1380 132 l -8 -34"/>
  </g>
  <circle cx="1530" cy="70" r="8" fill="#C1443B"/><circle cx="1450" cy="100" r="8" fill="#C1443B"/><circle cx="1370" cy="128" r="8" fill="#C1443B"/>

  <!-- hanging ornaments -->
  <g style="animation:sway 6s ease-in-out infinite; transform-origin:430px 60px;">
    <line x1="430" y1="60" x2="430" y2="150" stroke="#E3B85A" stroke-width="2"/>
    <circle cx="430" cy="172" r="22" fill="#C1443B"/>
    <rect x="424" y="148" width="12" height="8" rx="2" fill="#E3B85A"/>
    <path d="M420 166 a10 10 0 0 1 8 -6" stroke="#fff" stroke-width="2" fill="none" opacity=".5"/>
  </g>
  <g style="animation:sway 7s ease-in-out .6s infinite; transform-origin:1180px 60px;">
    <line x1="1180" y1="60" x2="1180" y2="130" stroke="#E3B85A" stroke-width="2"/>
    <circle cx="1180" cy="152" r="20" fill="#E3B85A"/>
    <rect x="1174" y="130" width="12" height="8" rx="2" fill="#C79E5C"/>
    <path d="M1170 146 a9 9 0 0 1 8 -6" stroke="#fff" stroke-width="2" fill="none" opacity=".55"/>
  </g>

  <!-- snowflakes / stars -->
  <g fill="#F4EFE4">
