  <path d="M1480 0 Q 1380 80 1420 190" stroke="#FFCB05" stroke-width="9" fill="none" stroke-linecap="round"/>

  <!-- balloons -->
  <g style="animation:floaty2 6s ease-in-out infinite; transform-origin:250px 0;">
