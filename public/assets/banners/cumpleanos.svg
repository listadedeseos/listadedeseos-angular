  </g>
  <g style="animation:floaty2 6.4s ease-in-out .3s infinite; transform-origin:1350px 0;">
    <path d="M1350 200 q14 40 0 80" stroke="#d9c07a" stroke-width="2" fill="none"/>
    <ellipse cx="1350" cy="150" rx="46" ry="56" fill="#17C3B2"/>
    <path d="M1343 204 l7 14 7-14z" fill="#12A899"/>
    <ellipse cx="1336" cy="130" rx="12" ry="18" fill="#fff" opacity=".4"/>
  </g>
  <g style="animation:floaty2 7.4s ease-in-out .5s infinite; transform-origin:1240px 0;">
