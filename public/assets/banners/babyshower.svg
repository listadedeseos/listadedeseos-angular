<svg width="1600" height="440" viewBox="0 0 1600 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF6EF"/>
      <stop offset="55%" stop-color="#F3F0F7"/>
      <stop offset="100%" stop-color="#FBEEF1"/>
    </linearGradient>
    <style>
      @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
      @keyframes floaty2 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
      @keyframes sway { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
      @keyframes twinkle { 0%,100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.1); } }
    </style>
  </defs>

  <rect width="1600" height="440" fill="url(#bsBg)"/>

  <!-- moon -->
  <g style="animation:floaty 7s ease-in-out infinite;">
    <circle cx="1330" cy="120" r="52" fill="#FBE6B0"/>
    <circle cx="1348" cy="108" r="52" fill="#F3F0F7"/>
  </g>

  <!-- stars -->
  <g fill="#F4B8C4">
    <path style="animation:twinkle 4s ease-in-out infinite" d="M240 90c2 12 6 16 18 18-12 2-16 6-18 18-2-12-6-16-18-18 12-2 16-6 18-18z"/>
    <path style="animation:twinkle 3.4s ease-in-out .6s infinite" d="M1210 250c1.6 9 4.5 12 13.5 13.5-9 1.6-12 4.5-13.5 13.5-1.6-9-4.5-12-13.5-13.5 9-1.6 12-4.5 13.5-13.5z" fill="#9FD4BE"/>
    <path style="animation:twinkle 4.6s ease-in-out .3s infinite" d="M430 330c1.6 9 4.5 12 13.5 13.5-9 1.6-12 4.5-13.5 13.5-1.6-9-4.5-12-13.5-13.5 9-1.6 12-4.5 13.5-13.5z" fill="#FBE0A2"/>
    <path style="animation:twinkle 3.8s ease-in-out .9s infinite" d="M1120 80c1.6 9 4.5 12 13.5 13.5-9 1.6-12 4.5-13.5 13.5-1.6-9-4.5-12-13.5-13.5 9-1.6 12-4.5 13.5-13.5z"/>
  </g>

  <!-- clouds -->
  <g fill="#ffffff" opacity=".85">
    <ellipse cx="150" cy="410" rx="120" ry="46"/>
    <ellipse cx="250" cy="405" rx="90" ry="40"/>
    <ellipse cx="1470" cy="415" rx="130" ry="44"/>
    <ellipse cx="1360" cy="412" rx="80" ry="34"/>
  </g>

  <!-- pacifier / chupete -->
  <g style="animation:floaty 6.5s ease-in-out infinite; transform-origin:150px 312px;">
    <g transform="translate(150,312) rotate(-14)">
      <circle cx="0" cy="-24" r="15" fill="none" stroke="#9FD4BE" stroke-width="7"/>
      <ellipse cx="0" cy="2" rx="32" ry="20" fill="#F4B8C4"/>
      <circle cx="-9" cy="2" r="3.5" fill="#F3F0F7"/>
      <circle cx="9" cy="2" r="3.5" fill="#F3F0F7"/>
      <path d="M-14 20 q14 32 28 0 q0 -17 -14 -17 q-14 0 -14 17z" fill="#FBE0A2"/>
    </g>
  </g>

  <!-- baby bottle / biberón -->
  <g style="animation:floaty2 7.5s ease-in-out .4s infinite; transform-origin:1455px 258px;">
    <g transform="translate(1455,258) rotate(12)">
      <path d="M-8 -74 q8 -16 16 0 q2 11 -8 11 q-10 0 -8 -11z" fill="#FBE0A2"/>
      <rect x="-20" y="-62" width="40" height="15" rx="5" fill="#9FD4BE"/>
      <rect x="-26" y="-48" width="52" height="116" rx="24" fill="#ffffff"/>
      <path d="M-26 38 q0 30 26 30 q26 0 26 -30 v-12 h-52z" fill="#F4B8C4" opacity=".85"/>
      <g stroke="#CBD8D0" stroke-width="2.5" stroke-linecap="round">
        <line x1="9" y1="-22" x2="19" y2="-22"/>
        <line x1="9" y1="-2" x2="19" y2="-2"/>
        <line x1="9" y1="18" x2="19" y2="18"/>
      </g>
    </g>
  </g>

  <!-- baby onesie / mameluco -->
  <g style="animation:floaty 7s ease-in-out .2s infinite; transform-origin:315px 320px;">
    <g transform="translate(315,320) rotate(-8)">
      <path d="M-30 -34 q30 20 60 0 l14 12 q4 4 0 8 l-12 10 -6 -5 v18 q0 6 -6 6 h-40 q-6 0 -6 -6 v-18 l-6 5 -12 -10 q-4 -4 0 -8 z" fill="#9FD4BE"/>
      <path d="M-30 -34 q30 20 60 0" fill="none" stroke="#7FC0AA" stroke-width="2.5"/>
      <circle cx="0" cy="8" r="3" fill="#FBE0A2"/>
      <circle cx="0" cy="20" r="3" fill="#FBE0A2"/>
    </g>
  </g>

  <!-- baby socks / calcetines -->
  <g style="animation:floaty2 8s ease-in-out .6s infinite; transform-origin:1300px 322px;">
    <g transform="translate(1300,322) rotate(6)">
      <path d="M-22 -26 h20 v26 q18 2 20 18 q1 8 -8 8 h-34 q-6 0 -6 -6 v-24 q0 -6 6 -6 h2 z" fill="#F4B8C4"/>
      <rect x="-24" y="-30" width="26" height="10" rx="4" fill="#F7D7DE"/>
      <path d="M-20 40 h26" stroke="#E79FAE" stroke-width="2" opacity=".6"/>
    </g>
  </g>

  <!-- rattle / sonajero -->
  <g style="animation:sway 5.5s ease-in-out infinite; transform-origin:250px 150px;">
    <g transform="translate(250,150) rotate(-12)">
      <line x1="0" y1="6" x2="0" y2="46" stroke="#CBB7A6" stroke-width="6" stroke-linecap="round"/>
      <circle cx="0" cy="50" r="7" fill="#9FD4BE"/>
      <circle cx="0" cy="-10" r="26" fill="#FBE0A2"/>
      <circle cx="0" cy="-10" r="26" fill="none" stroke="#EBCB7C" stroke-width="2.5"/>
      <circle cx="-8" cy="-16" r="3.5" fill="#fff" opacity=".7"/>
      <path d="M-9 -2 q9 8 18 0" fill="none" stroke="#E0A96A" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- little hearts -->
  <path style="animation:twinkle 4s ease-in-out .4s infinite" d="M1120 320 c -6 -10 -22 -4 -22 8 c 0 9 14 16 22 22 c 8 -6 22 -13 22 -22 c 0 -12 -16 -18 -22 -8z" fill="#F4B8C4"/>
  <path style="animation:twinkle 3.6s ease-in-out .9s infinite" d="M470 130 c -4 -7 -15 -3 -15 6 c 0 6 10 11 15 15 c 5 -4 15 -9 15 -15 c 0 -9 -11 -13 -15 -6z" fill="#9FD4BE"/>
</svg>
