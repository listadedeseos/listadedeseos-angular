@if(loading){
<app-loading></app-loading>
}
<app-custom-modal [customTitle]="(id?'Editar':'Nuevo') + ' usuario'" (closeFunction)="closeFormFunction()"
    (acceptFunction)="acceptFormFunction()">
    <form [formGroup]="saveForm" (ngSubmit)="saveEntity()" class="flex flex-col gap-5">

        <!-- Username -->
        <div>
            <label class="block text-xs font-bold uppercase tracking-wide text-muted mb-1.5" for="username">
                Nombre de usuario
            </label>
            <input
                class="w-full px-3 py-2.5 border border-line rounded-lg bg-white text-ink"
                id="username" type="text" placeholder="Nombre de usuario" formControlName="username">
        </div>

        <!-- Name -->
        <div>
            <label class="block text-xs font-bold uppercase tracking-wide text-muted mb-1.5" for="name">
                Nombre completo
            </label>
            <input
                class="w-full px-3 py-2.5 border border-line rounded-lg bg-white text-ink"
                id="name" type="text" placeholder="Nombre completo" formControlName="name">
        </div>

        <!-- Surname -->
        <div>
            <label class="block text-xs font-bold uppercase tracking-wide text-muted mb-1.5" for="surname">
                Apellido/s
            </label>
            <input
                class="w-full px-3 py-2.5 border border-line rounded-lg bg-white text-ink"
                id="surname" type="text" placeholder="Apellido" formControlName="surname">
        </div>

        <!-- Email -->
        <div>
            <label class="block text-xs font-bold uppercase tracking-wide text-muted mb-1.5" for="email">
                Email
            </label>
            <input
                class="w-full px-3 py-2.5 border border-line rounded-lg bg-white text-ink"
                id="email" type="email" placeholder="ejemplo@email.com" formControlName="email">
        </div>

        <!-- Role -->
        <div>
            <label class="block text-xs font-bold uppercase tracking-wide text-muted mb-1.5" for="role">
                Rol
            </label>
            <input
                class="w-full px-3 py-2.5 border border-line rounded-lg bg-white text-ink"
                id="role" type="text" placeholder="Rol del usuario" formControlName="role">
        </div>

        <!-- Password -->
        <div>
            <label class="block text-xs font-bold uppercase tracking-wide text-muted mb-1.5" for="password">
                Contraseña
            </label>
            <input
                class="w-full px-3 py-2.5 border border-line rounded-lg bg-white text-ink"
                id="password" type="password" placeholder="Contraseña" formControlName="password">
        </div>

        @if(dropdowns.wishlists && dropdowns.wishlists.length > 0){
        <div>
            <label for="main_wish_list_id" class="block text-xs font-bold uppercase tracking-wide text-muted mb-1.5">
                Lista de deseos principal *
            </label>
            <select formControlName="main_wish_list_id" id="main_wish_list_id"
                class="w-full px-3 py-2.5 border border-line rounded-lg bg-white text-ink">

                <!-- <select formControlName="main_wish_list_id" id="main_wish_list_id"
                    class="block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-all duration-200"
                    [class]="submitted && f['main_wish_list_id'].errors ? 'border-red-300 focus:ring-red-500 focus:border-red-500' : ''"> -->

                <option [value]="-1" disabled>Selecciona una lista</option>

                @for (wishlist of dropdowns.wishlists; track $index) {
                <option [value]="wishlist.id">
                    {{ wishlist.name }}
                </option>
                }

            </select>

            <!-- @if(submitted && f['main_wish_list_id'].errors?.['required']){
                            <div class="mt-2 text-sm text-red-600">
                                La lista de deseos principal es requerida
                            </div>
                            } -->

        </div>
        }

    </form>
</app-custom-modal>
