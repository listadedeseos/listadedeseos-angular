<div class="relative rounded-xl bg-cream-alt overflow-hidden">
    <!-- Modal header -->
    <div class="flex items-center gap-3 justify-between border-b border-line-soft px-6 py-[18px] bg-white">
        <h3 class="font-serif font-medium text-xl text-ink">
            {{modalTitle}}
        </h3>

        <button type="button"
            class="w-[30px] h-[30px] flex items-center justify-center border border-line rounded-lg bg-white text-muted hover:border-ink hover:text-ink transition-colors duration-200"
            (click)="closeFormFunction()">
            <fa-icon [icon]="['fas', 'xmark']" class="text-sm"></fa-icon>
        </button>
    </div>

    <!-- Modal body -->
    <div class="p-6 min-h-[200px]">
    <form [formGroup]="saveForm" (ngSubmit)="saveEntity()" class="flex flex-col gap-4">

        <!-- Nombre del producto -->
        <div>
            <label class="block text-xs font-bold uppercase tracking-wide text-muted mb-1.5" for="productName">
                Nombre del producto
            </label>
            <input
                class="w-full px-3 py-2.5 border border-line rounded-lg bg-white text-ink"
                id="productName"
                type="text"
                placeholder="Ingresa el nombre del producto"
                formControlName="name">
        </div>

        <!-- Botón para mostrar/ocultar campos opcionales -->
        <div>
            <button type="button"
                class="px-4.5 py-2.5 border border-line-strong text-ink font-semibold rounded-lg hover:border-ink transition-colors duration-200 bg-transparent"
                (click)="toggleOptionalFields()">
                {{ showOptionalFields ? 'Ocultar campos opcionales' : 'Mostrar campos opcionales' }}
            </button>
        </div>

        <!-- Campos opcionales -->
        @if(showOptionalFields){
        <div class="border border-line-soft rounded-lg bg-white p-4.5 flex flex-col gap-4">
            <div class="text-[11px] font-bold uppercase tracking-wide text-muted-light">Campos opcionales</div>
            <!-- URL de la imagen -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wide text-muted mb-1.5" for="imageUrl">
                    URL de la imagen
                </label>
                <input
                    class="w-full px-3 py-2.5 border border-line rounded-lg bg-white text-ink"
                    id="imageUrl"
                    type="url"
                    placeholder="https://ejemplo.com/imagen.jpg"
                    formControlName="url_preview">
            </div>

            <!-- URL del producto -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wide text-muted mb-1.5" for="productUrl">
                    URL del producto
                </label>
                <input
                    class="w-full px-3 py-2.5 border border-line rounded-lg bg-white text-ink"
                    id="productUrl"
                    type="url"
                    placeholder="https://tienda.com/producto"
                    formControlName="url_product">
            </div>

            <!-- Precio -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wide text-muted mb-1.5" for="price">
                    Precio
                </label>
                <input
                    class="w-full px-3 py-2.5 border border-line rounded-lg bg-white text-ink"
                    id="price"
                    type="number"
                    step="0.01"
                    min="0"
                    placeholder="0.00"
                    formControlName="price">
            </div>
        </div>
        }

        <!-- Estado visible -->
        <div>
            <label class="flex items-start gap-2.5 cursor-pointer">
                <input
                    type="checkbox"
                    formControlName="is_active"
                    class="w-[17px] h-[17px] mt-0.5 accent-primary-500">
                <div class="flex flex-col">
                    <span class="text-sm font-semibold text-ink">Producto visible</span>
                    <span class="text-xs text-muted-light">Marca si quieres que el producto sea visible públicamente</span>
                </div>
            </label>
        </div>

    </form>
    </div>

    <!-- Modal footer -->
    <div class="flex justify-end gap-2.5 border-t border-line-soft px-6 py-4 bg-white">
        <button type="button"
            class="px-4.5 py-2.5 border border-line-strong text-ink font-semibold rounded-lg hover:border-ink transition-colors duration-200 bg-transparent"
            (click)="closeFormFunction()">
            Cancelar
        </button>

        <button type="button"
            class="px-4.5 py-2.5 bg-primary-500 text-white font-semibold rounded-lg hover:bg-primary-600 transition-colors duration-200"
            (click)="acceptFormFunction()">
            Aceptar
        </button>
    </div>

    @if(loading){
    <!-- Cargando/guardando: overlay dentro del modal, solo visible si tarda más de 300ms (evita el destello) -->
    <div class="absolute inset-0 z-10 flex items-center justify-center bg-cream-alt/70 animate-fadein-delayed">
        <div class="w-8 h-8 border-2 border-line border-t-primary-500 rounded-full animate-spin"></div>
    </div>
    }
</div>
