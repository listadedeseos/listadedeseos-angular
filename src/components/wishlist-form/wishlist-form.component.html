@if(loading){
<app-loading></app-loading>
}
<div class="rounded-xl bg-cream-alt overflow-hidden">
    <!-- Modal header -->
    <div class="flex items-center gap-3 justify-between border-b border-line-soft px-6 py-[18px] bg-white">
        <h3 class="font-serif font-medium text-xl text-ink">
            {{modalTitle}}
        </h3>

        <button type="button"
            class="w-[30px] h-[30px] flex items-center justify-center border border-line rounded-lg bg-white text-muted hover:border-ink hover:text-ink transition-colors duration-200"
            (click)="closeFormFunction()">
            <fa-icon [icon]="['fas', 'xmark']" class="text-sm"></fa-icon>
        </button>
    </div>

    <!-- Modal body -->
    <div class="p-6 min-h-[200px]">
    <form [formGroup]="saveForm" (ngSubmit)="saveEntity()" class="flex flex-col gap-4">

        <!-- Nombre de la lista -->
        <div>
            <label class="block text-xs font-bold uppercase tracking-wide text-muted mb-1.5" for="name">
                Nombre de la lista
            </label>
            <input class="w-full px-3 py-2.5 border border-line rounded-lg bg-white text-ink" id="name" type="text"
                placeholder="Mi lista de deseos" formControlName="name">
        </div>

        @if(false){
        <!-- Tema de la lista -->
        <div>
            <label class="block text-xs font-bold uppercase tracking-wide text-muted mb-1.5">
                Tema de la lista
            </label>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
                <label class="flex items-center gap-2 px-3.5 py-2.5 border rounded-lg bg-white cursor-pointer"
                    [class.border-ink]="saveForm.get('theme')?.value === '' || saveForm.get('theme')?.value === null"
                    [class.border-line]="saveForm.get('theme')?.value !== '' && saveForm.get('theme')?.value !== null">
                    <input type="radio" name="theme" formControlName="theme" value="" class="sr-only">
                    <span class="w-2.5 h-2.5 rounded-sm bg-line-strong"></span>
                    <span class="text-sm font-semibold text-ink">Sin tema específico</span>
                </label>
                @for(theme of themes; track theme.value) {
                <label class="flex items-center gap-2 px-3.5 py-2.5 border rounded-lg bg-white cursor-pointer"
                    [class.border-ink]="saveForm.get('theme')?.value === theme.value"
                    [class.border-line]="saveForm.get('theme')?.value !== theme.value">
                    <input type="radio" name="theme" formControlName="theme" [value]="theme.value" class="sr-only">
                    <span class="w-2.5 h-2.5 rounded-sm" [class.bg-event-babyshower]="theme.value === 'babyshower'"
                        [class.bg-event-cumpleanos]="theme.value === 'cumpleanos'"
                        [class.bg-event-boda]="theme.value === 'boda'"
                        [class.bg-event-navidad]="theme.value === 'navidad'"
                        [class.bg-event-graduacion]="theme.value === 'graduacion'"></span>
                    <span class="text-sm font-semibold text-ink">{{theme.label}}</span>
                </label>
                }
            </div>
        </div>
        }

        <!-- Fecha límite -->
        <div>
            <label class="block text-xs font-bold uppercase tracking-wide text-muted mb-1.5" for="date_end">
                Fecha límite (opcional)
            </label>
            <input class="w-full px-3 py-2.5 border border-line rounded-lg bg-white text-ink" id="date_end" type="date"
                formControlName="date_end">
            <button type="button" (click)="deleteDateEnd()" class="mt-2 text-xs text-danger-text hover:underline">
                Eliminar fecha límite
            </button>
        </div>

        <!-- Integraciones con plataformas -->
        <div>
            <h3 class="text-xs font-bold uppercase tracking-wide text-muted mb-2.5">Conectar con plataformas</h3>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                <!-- Steam Integration -->
                <div class="p-4 border border-line-soft rounded-lg bg-white">
                    <h4 class="text-sm font-bold text-ink">Steam</h4>
                    <p class="text-xs text-muted-light mt-0.5">Conecta tu perfil de Steam</p>

                    <label class="block text-xs font-bold uppercase tracking-wide text-muted mb-1.5 mt-3"
                        for="steamUsername">
                        Nombre de usuario
                    </label>
                    <input class="w-full px-2.5 py-2 text-sm border border-line rounded-lg bg-white text-ink"
                        id="steamUsername" type="text" placeholder="tu_usuario_steam" formControlName="steam_username">
                </div>

                <!-- Amazon Integration -->
                <div class="p-4 border border-line-soft rounded-lg bg-white">
                    <h4 class="text-sm font-bold text-ink">Amazon</h4>
                    <p class="text-xs text-muted-light mt-0.5">ID de tu lista de Amazon</p>

                    <label class="block text-xs font-bold uppercase tracking-wide text-muted mb-1.5 mt-3"
                        for="amazonWishlist">
                        ID de lista de deseos
                    </label>
                    <input class="w-full px-2.5 py-2 text-sm border border-line rounded-lg bg-white text-ink"
                        id="amazonWishlist" type="text" placeholder="ABCD1234EFGH5678"
                        formControlName="amazon_wishlist_id">
                </div>

            </div>

            <div class="mt-3 p-3 border border-line-soft rounded-lg bg-white">
                <p class="text-xs text-muted-light">
                    <strong class="text-ink">Tip:</strong> Estas integraciones son opcionales. Puedes agregar productos
                    manualmente sin conectar ninguna plataforma.
                </p>
            </div>
        </div>

    </form>
    </div>

    <!-- Modal footer -->
    <div class="flex justify-end gap-2.5 border-t border-line-soft px-6 py-4 bg-white">
        <button type="button"
            class="px-4.5 py-2.5 border border-line-strong text-ink font-semibold rounded-lg hover:border-ink transition-colors duration-200 bg-transparent"
            (click)="closeFormFunction()">
            Cancelar
        </button>

        <button type="button"
            class="px-4.5 py-2.5 bg-primary-500 text-white font-semibold rounded-lg hover:bg-primary-600 transition-colors duration-200"
            (click)="acceptFormFunction()">
            Aceptar
        </button>
    </div>
</div>
