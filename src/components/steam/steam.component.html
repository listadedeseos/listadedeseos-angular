@if(username){

<section class="flex items-center pb-3.5 border-b border-line mb-4">

    <a class="inline-flex items-center gap-2 text-sm font-semibold text-muted-dark hover:text-ink transition-colors duration-200"
        [href]="'https://steamcommunity.com/id/'+username+'/wishlist'" target="_blank" rel="noopener noreferrer">
        <fa-icon [icon]="['fab', 'steam']"></fa-icon>
        Steam
    </a>

    @if(isLogged){
    <button
        class="group ml-auto inline-flex items-center gap-2 px-3 py-2 border border-line rounded-lg bg-white text-muted-dark text-sm font-semibold hover:border-ink hover:text-ink transition-colors duration-200"
        (click)="refresh()">
        <fa-icon [icon]="['fas', 'rotate']"
            [ngClass]="['group-hover:duration-500 group-hover:rotate-180 group-hover:transition-transform']"></fa-icon>
        Refrescar Juegos
    </button>
    }

</section>

<section class="flex-1 responsive-grid gap-2" [style.--items-per-row]="itemsPerRow">

    <!-- Loading Cards -->
    @if(loading){
    @for(item of [].constructor(6); track $index){
    <div class="animate-pulse bg-white border border-line-card rounded-lg p-3">
        <div class="aspect-video bg-swatch rounded-lg mb-2"></div>
        <div class="h-2 rounded w-20 bg-swatch mb-2"></div>
        <div class="flex gap-1">
            <div class="h-4 w-full rounded bg-swatch"></div>
            <div class="h-4 w-full rounded bg-swatch"></div>
        </div>
    </div>
    }
    <!-- Loading Cards END-->

    } @else {

    <!-- Products list -->
    @for(counter of [].constructor(list.length>6 && showMore ? 6 : list.length); track $index){

    <!-- See more button -->
    @if($index == 5 && list.length == 7 && showMore){

    <a [routerLink]="['/list', uuidList, 'steam']"
        class="h-full flex flex-col items-center justify-center gap-2 border border-line-card rounded-lg text-muted-dark hover:border-ink hover:text-ink transition-colors duration-200 text-sm font-semibold">
        <span>Ver más</span>
        <fa-icon [icon]="['fas', 'chevron-right']"></fa-icon>
    </a>

    <!-- See more button END -->

    }@else{

    <app-card aspect="video" [principalUrl]="list[$index].steam_url" [img]="list[$index].img" [name]="list[$index].name"
        [price]="list[$index].price" [count]="list[$index].count" principalLabelString="Steam"
        secondaryLabelString="Instant gaming" [secondaryUrl]="list[$index].instant_gaming_url"
        [isReserved]="list[$index].is_reserved" [isLogged]="isLogged" (toggleReserve)="reserveGame(list[$index].id)"
        [id]="list[$index].id"></app-card>
    }

    }
    <!-- Products list END -->

    }

</section>

}
