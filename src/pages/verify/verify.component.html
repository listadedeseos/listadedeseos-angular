@if(loading){ <app-loading></app-loading> }
<section class="min-h-screen bg-cream">
    <div class="flex flex-col items-center justify-center px-6 py-8 mx-auto md:h-screen lg:py-0">
        <h1 class="flex items-center mb-6 font-serif font-normal text-4xl text-ink tracking-tight">LISTA DE DESEOS</h1>
        <div class="w-full border border-line-card rounded-xl bg-white md:mt-0 sm:max-w-md xl:p-0">
            <div class="p-7 space-y-6">
                <h2 class="text-2xl font-semibold text-ink">
                    Entra en tu cuenta
                </h2>
                <form class="space-y-5" [formGroup]="form" (submit)="onSubmit()">

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wide text-muted mb-1.5">
                            Código de seguridad
                        </label>
                        <p class="text-sm text-muted mb-2">Te hemos enviado un código de verificación a tu
                            correo</p>

                        <input formControlName="security_code" type="text" placeholder="XXXX"
                            class="w-full px-3 py-2.5 border border-line rounded-lg bg-white text-ink text-sm placeholder-muted-placeholder"
                            pattern="[0-9]*" required>
                    </div>

                    @if (error) {
                    <div class="flex items-start gap-2 p-3.5 border border-danger-border rounded-lg bg-danger-light">
                        <p class="text-sm text-danger-text font-semibold">Código incorrecto</p>
                    </div>
                    }

                    <button type="submit"
                        class="w-full py-3 bg-ink text-cream font-semibold rounded-lg hover:bg-ink-hover transition-colors duration-200">
                        Verificar
                    </button>

                </form>
            </div>
        </div>
    </div>
</section>
