<main class="p-2 max-w-7xl mx-auto">
    <sau-table
        #customTable
        [url]="url"
        [headers]="headers"
        contentList="list"
        contentTotal="total"
        pageParamName="page"
        limitParamName="limit"
        [sizeBetweenPages]="1"
        [limit]="10"
        [sizeInitialPage]="1"
        (editEvent)="openEditModal($event)"
        (deleteEvent)="openDeleteModal($event)"
    >
    </sau-table>
</main>
