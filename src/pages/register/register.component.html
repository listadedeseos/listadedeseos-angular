<section class="min-h-screen overflow-hidden relative bg-cream">
    <div class="flex flex-col items-center justify-center px-6 py-8 mx-auto min-h-screen lg:py-0 relative z-10">
        <!-- Logo y título -->
        <div class="flex items-center mb-8 gap-3">
            <h1 class="font-serif font-normal text-4xl md:text-5xl text-ink tracking-tight">
                LISTA DE DESEOS
            </h1>
        </div>

        <!-- Formulario de registro -->
        <div class="w-full border border-line-card rounded-xl bg-white md:mt-0 sm:max-w-2xl xl:p-0">
            <div class="p-7 space-y-6">
                <app-social-network-access></app-social-network-access>

                <div class="text-center">
                    <h2 class="text-2xl font-semibold text-ink mb-2">
                        ¡Únete a nosotros!
                    </h2>
                    <p class="text-muted text-sm">
                        Crea tu cuenta y empieza a gestionar tus listas de deseos
                    </p>
                </div>

                <form class="space-y-5" [formGroup]="saveForm" (submit)="onSubmit()">
                    <!-- Fila 1: Nombre y Apellido -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wide text-muted mb-1.5">
                                Nombre
                            </label>
                            <input formControlName="name"
                                   type="text"
                                   placeholder="Tu nombre"
                                   class="w-full px-3 py-2.5 border border-line rounded-lg bg-white text-ink text-sm placeholder-muted-placeholder"
                                   required>
                        </div>

                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wide text-muted mb-1.5">
                                Apellido(s)
                            </label>
                            <input formControlName="surname"
                                   type="text"
                                   placeholder="Tus apellidos"
                                   class="w-full px-3 py-2.5 border border-line rounded-lg bg-white text-ink text-sm placeholder-muted-placeholder"
                                   required>
                        </div>
                    </div>

                    <!-- Fila 2: Username y Email -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wide text-muted mb-1.5">
                                Nombre de usuario
                            </label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <span class="text-muted-placeholder text-sm">&#64;</span>
                                </div>
                                <input formControlName="username"
                                       type="text"
                                       placeholder="tu_usuario"
                                       class="w-full pl-7 pr-3 py-2.5 border border-line rounded-lg bg-white text-ink text-sm placeholder-muted-placeholder"
                                       required>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wide text-muted mb-1.5">
                                Correo electrónico
                            </label>
                            <input formControlName="email"
                                   type="email"
                                   placeholder="tu@email.com"
                                   class="w-full px-3 py-2.5 border border-line rounded-lg bg-white text-ink text-sm placeholder-muted-placeholder"
                                   required>
                        </div>
                    </div>

                    <!-- Fila 3: Contraseñas -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wide text-muted mb-1.5">
                                Contraseña
                            </label>
                            <input formControlName="password"
                                   type="password"
                                   placeholder="••••••••"
                                   class="w-full px-3 py-2.5 border border-line rounded-lg bg-white text-ink text-sm placeholder-muted-placeholder"
                                   required>
                        </div>

                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wide text-muted mb-1.5">
                                Confirmar contraseña
                            </label>
                            <input formControlName="repassword"
                                   type="password"
                                   placeholder="••••••••"
                                   class="w-full px-3 py-2.5 border border-line rounded-lg bg-white text-ink text-sm placeholder-muted-placeholder"
                                   required>
                        </div>
                    </div>

                    @if(errors){
                    <div class="flex items-start gap-2 p-3.5 border border-danger-border rounded-lg bg-danger-light">
                        <p class="text-sm text-danger-text font-semibold">
                            Un error ha ocurrido al intentar registrarte. Por favor, revisa los datos ingresados.
                        </p>
                    </div>
                    }

                    <button type="submit"
                            class="w-full py-3 bg-primary-500 text-white font-semibold rounded-lg hover:bg-primary-600 transition-colors duration-200">
                        Crear mi cuenta
                    </button>

                    <div class="text-center">
                        <p class="text-sm text-muted">
                            ¿Ya tienes cuenta?
                            <a class="text-primary-500 font-bold ml-1"
                               routerLink="/login">
                                Inicia sesión aquí
                            </a>
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Ondas decorativas de fondo -->
    <svg class="absolute bottom-0 left-0 w-full h-1/3 -z-10"
         xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 1024 200"
         preserveAspectRatio="none">
        <defs>
            <linearGradient id="wave1-register" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#DDD6CB;stop-opacity:0.6" />
                <stop offset="100%" style="stop-color:#F4F1EC;stop-opacity:0.6" />
            </linearGradient>
            <linearGradient id="wave2-register" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#C6BCAC;stop-opacity:0.6" />
                <stop offset="100%" style="stop-color:#DDD6CB;stop-opacity:0.6" />
            </linearGradient>
            <linearGradient id="wave3-register" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#9A4A28;stop-opacity:0.35" />
                <stop offset="100%" style="stop-color:#C6BCAC;stop-opacity:0.5" />
            </linearGradient>
        </defs>
        <g fill="none">
            <path fill="url(#wave1-register)"
                  d="M 0,13 C 68.4,23.4 205.2,65 342,65 C 478.8,65 547.6,15.6 684,13 C 820.4,10.4 956,44.2 1024,52L1024 200L0 200z">
            </path>
            <path fill="url(#wave2-register)"
                  d="M 0,107 C 68.4,101.8 205.2,76 342,81 C 478.8,86 547.6,131.6 684,132 C 820.4,132.4 956,92.8 1024,83L1024 200L0 200z">
            </path>
            <path fill="url(#wave3-register)"
                  d="M 0,198 C 68.4,187.2 205.2,147.6 342,144 C 478.8,140.4 547.6,182 684,180 C 820.4,178 956,143.2 1024,134L1024 200L0 200z">
            </path>
        </g>
    </svg>
</section>
