<section class="p-6">

    <header class="flex items-center justify-between py-4">

        <!-- back button -->
        <a [routerLink]="['/list', wishlist.uuid]"
            class="inline-flex items-center gap-2 px-3 py-2 border border-line rounded-lg bg-white text-muted-dark text-sm font-semibold hover:border-ink hover:text-ink transition-colors duration-200">
            <fa-icon [icon]="['fas', 'arrow-left']"></fa-icon>
            <span>Volver a la lista</span>
        </a>

        @if(isLogged){
        <!-- show/hide reserved products -->
        <button (click)="toggleShowReserveButtons()"
            class="ml-auto inline-flex items-center gap-2 px-3 py-2 border border-line rounded-lg bg-white text-muted-dark text-sm font-semibold hover:border-ink hover:text-ink transition-colors duration-200">
            <fa-icon [icon]="['fas', ( showReserveButton ? 'eye': 'eye-slash' )]"></fa-icon>
            <span class="hidden md:inline">
                {{showReserveButton ? 'Ocultar' : 'Mostrar'}}
                reservas
            </span>
        </button>
        }

    </header>

    <app-amazon [amazonWishlistId]="wishlist.amazon_wishlist_id" [wishlistId]="wishlist.id"></app-amazon>

</section>
