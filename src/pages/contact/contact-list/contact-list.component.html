<main class="p-6 max-w-6xl mx-auto">
    <div class="flex items-center gap-2 mb-3.5">
        <span class="w-2.5 h-2.5 rounded-sm bg-admin"></span>
        <span class="text-xs font-bold uppercase tracking-wide text-admin">Modo administrador</span>
    </div>
    <h1 class="font-serif font-normal text-4xl text-ink tracking-tight">Mensajes de contacto</h1>
    <p class="text-muted text-base mt-2 mb-6">Sugerencias, errores y consultas recibidas desde el formulario.</p>

    <div class="border border-line-card rounded-xl bg-white overflow-hidden">
        <sau-table #customTable [url]="url" [headers]="headers" contentList="list" contentTotal="total" pageParamName="page"
            limitParamName="limit" [sizeBetweenPages]="1" [limit]="10" [sizeInitialPage]="1"
            (deleteEvent)="toogleDeleteForm($event)">
        </sau-table>
    </div>

    @if (deleteProduct) {
    <app-custom-delete [url]="url" [id]="id" (closeFunction)="toogleDeleteForm()"
        (acceptFunction)="customTable.getItems()"></app-custom-delete>
    }
</main>
